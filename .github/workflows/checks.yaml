name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.12.5'
          - python: '3.14'
            homeassistant: '2026.3.4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python '${{ matrix.python }}'
      - run: uv pip install 'homeassistant==${{ matrix.homeassistant }}' 'pytest>=8,<10' 'pytest-asyncio>=1,<2' 'ruff>=0.12,<1'
      - run: .venv/bin/ruff check custom_components tests scripts
      - run: .venv/bin/ruff format --check custom_components tests scripts
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ha-decisions-${{ matrix.homeassistant }}
          path: dist/*.zip
